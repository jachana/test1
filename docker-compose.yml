services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      STARMAP_CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      STARMAP_GEOCODE_USER_AGENT: "starmap-laser-mvp/0.1 (contact: you@example.com)"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health').status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      BACKEND_URL: "http://backend:8000"
    depends_on:
      - backend
